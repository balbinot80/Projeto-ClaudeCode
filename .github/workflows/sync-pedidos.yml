name: Sync Jueri → Supabase

on:
  schedule:
    # Horário comercial (7h–20h, horário de Brasília = 10h–23h UTC): a cada hora
    - cron: '0 10-23 * * *'
    # Fora do horário comercial (20h–7h BRT = 0h, 3h, 6h, 9h UTC): a cada 3 horas
    - cron: '0 0,3,6,9 * * *'
  workflow_dispatch:
    # Permite disparo manual pelo GitHub Actions UI

jobs:
  sync:
    name: Sincronizar pedidos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci --omit=dev

      - name: Executar sync
        run: node scripts/sync-pedidos.mjs
        env:
          JUERI_BASE_URL: ${{ secrets.JUERI_BASE_URL }}
          JUERI_TOKEN:    ${{ secrets.JUERI_TOKEN }}
          SUPABASE_URL:   ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:   ${{ secrets.SUPABASE_KEY }}
