name: Sync Jueri → Supabase

on:
  schedule:
    # Roda a cada 2 horas (mesmo intervalo do cache do Streamlit)
    - cron: '0 */2 * * *'
  workflow_dispatch:
    # Permite disparo manual pelo GitHub Actions UI

jobs:
  sync:
    name: Sincronizar pedidos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci --omit=dev

      - name: Executar sync
        run: node scripts/sync-pedidos.mjs
        env:
          JUERI_BASE_URL: ${{ secrets.JUERI_BASE_URL }}
          JUERI_TOKEN:    ${{ secrets.JUERI_TOKEN }}
          SUPABASE_URL:   ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:   ${{ secrets.SUPABASE_KEY }}
